name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app (capacitor mode)
        run: npx vite build --mode capacitor

      - name: Install Capacitor Android platform
        run: npx cap add android

      - name: Prepare app icon
        run: |
          mkdir -p resources
          cp "assets/.aistudio/Desain tanpa judul_20260822_204244_0000.png" resources/icon.png
          cp "assets/.aistudio/Desain tanpa judul_20260822_204244_0000.png" resources/splash.png

      - name: Generate icons & splash screen
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
